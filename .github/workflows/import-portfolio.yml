name: Import portfolio
on:
  push:
    paths: [.github/workflows/import-portfolio.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify portfolio
        env:
          SITE: https://jiang-lan-portfolio.luxetarragon16.chatgpt.site
        run: |
          set -euo pipefail
          mkdir -p media
          curl --retry 3 -fsSL "$SITE/?view=motion" -o index.html
          grep -q 'portfolio-pointer' index.html
          curl --retry 3 -fsSL "$SITE/media/hero.mp4" -o media/hero.mp4
          for i in {01..08}; do
            curl --retry 3 -fsSL "$SITE/media/work-$i.mp4" -o "media/work-$i.mp4"
            curl --retry 3 -fsSL "$SITE/media/cover-$i.jpg" -o "media/cover-$i.jpg"
          done
          for file in media/*.mp4; do
            test "$(dd if="$file" bs=1 skip=4 count=4 status=none)" = ftyp
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html media
          git commit -m 'Add portfolio and eight videos'
          git push
